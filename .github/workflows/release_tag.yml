name: Auto Tag & Release on Version Update

on:
  workflow_run:
    workflows: ["D-Zero Quality Gates (CI)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update_tag:
        description: 'Force-update existing tag even if it already points to HEAD'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  tag-and-release:
    name: Detect Version & Update Git Tag
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Detect workspace package version
        id: detect
        run: |
          VERSION=$(grep -E '^version:[[:space:]]*' packages/d_zero_core/pubspec.yaml | head -n 1 | sed -E 's/^version:[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::Failed to parse version from packages/d_zero_core/pubspec.yaml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected D-Zero version: $VERSION"

          # Verify all publishable packages share the same synchronized version
          for pubspec in packages/*/pubspec.yaml; do
            if grep -q "^publish_to:[[:space:]]*'none'" "$pubspec"; then
              continue
            fi
            PKG_VER=$(grep -E '^version:[[:space:]]*' "$pubspec" | head -n 1 | sed -E 's/^version:[[:space:]]*["'\'']?([^"'\''[:space:]]+)["'\'']?/\1/')
            if [ "$PKG_VER" != "$VERSION" ]; then
              echo "::error::Version mismatch in $pubspec ($PKG_VER != $VERSION). Run 'dart run tool/distribute_widgets.dart --set-version=$VERSION --sync-only' first."
              exit 1
            fi
          done

          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-list -n 1 "refs/tags/$VERSION" 2>/dev/null || true)

          if [ -z "$TAG_SHA" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Tag '$VERSION' does not exist yet and will be created at $HEAD_SHA."
          elif [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
            echo "Tag '$VERSION' points to $TAG_SHA; updating to latest CI-verified commit $HEAD_SHA."
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            echo "Tag '$VERSION' already points to $HEAD_SHA."
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.detect.outputs.should_update == 'true' || inputs.force_update_tag == true
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "([[:space:]]|$)" { in_section=1; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' CHANGELOG.md > /tmp/release_notes.md

          if [ ! -s /tmp/release_notes.md ]; then
            echo "Synchronized release of D-Zero workspace packages v$VERSION." > /tmp/release_notes.md
          fi

          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${VERSION}$" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "### 📝 Commits since \`$PREV_TAG\`"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"* %s (%h)"
              echo ""
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}"
            } >> /tmp/release_notes.md
          fi
          cat /tmp/release_notes.md

      - name: Create or update Git tag
        if: steps.detect.outputs.should_update == 'true' || inputs.force_update_tag == true
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$VERSION" -m "Release D-Zero v$VERSION"
          git push origin "refs/tags/$VERSION" --force
          echo "✅ Pushed tag: $VERSION -> $(git rev-parse HEAD)"

      - name: Create or update GitHub Release
        if: steps.detect.outputs.should_update == 'true' || inputs.force_update_tag == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.detect.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --target "$(git rev-parse HEAD)" \
              --title "D-Zero v$VERSION" \
              --notes-file /tmp/release_notes.md
          else
            gh release create "$VERSION" \
              --verify-tag \
              --title "D-Zero v$VERSION" \
              --notes-file /tmp/release_notes.md
          fi
