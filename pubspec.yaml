name: zero_player
description: "A next-generation, zero-jank Flutter video player optimized for Impeller, utilizing FFI shared-memory and custom RenderBoxes."
version: 0.0.1
homepage: https://github.com/ANIZA15/zero_player
repository: https://github.com/ANIZA15/zero_player
issue_tracker: https://github.com/ANIZA15/zero_player/issues
topics:
  - video
  - player
  - impeller
  - ffi
  - streaming

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fexcy.zero_player
        pluginClass: ZeroPlayerPlugin
      ios:
        pluginClass: ZeroPlayerPlugin
      macos:
        pluginClass: ZeroPlayerPlugin

  shaders:
    - shaders/zero_blur.frag
