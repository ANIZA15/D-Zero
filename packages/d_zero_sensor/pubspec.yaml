name: d_zero_sensor
description: "Zero-allocation C++17 FFI camera scanner (ZCameraScanner), 3D LiDAR point cloud, barcode scanner overlay, dynamic QR matrix generator, compass, and leveler widgets for Flutter."
version: 0.1.6
homepage: https://github.com/ANIZA15/D-Zero
repository: https://github.com/ANIZA15/D-Zero/tree/main/packages/d_zero_sensor
issue_tracker: https://github.com/ANIZA15/D-Zero/issues
topics:
  - sensor
  - compass
  - scanner
  - zero-allocation
  - impeller

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  d_zero_core: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: ZeroSensorPlugin
      macos:
        pluginClass: ZeroSensorPlugin
