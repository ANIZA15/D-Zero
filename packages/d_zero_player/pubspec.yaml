name: d_zero_player
description: "A next-generation, zero-jank Flutter video player optimized for Impeller, utilizing FFI shared-memory and custom RenderBoxes."
version: 0.1.3
homepage: https://github.com/ANIZA15/D-Zero
repository: https://github.com/ANIZA15/D-Zero/tree/main/packages/d_zero_player
issue_tracker: https://github.com/ANIZA15/D-Zero/issues
topics:
  - video
  - player
  - impeller
  - ffi
  - streaming

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  d_zero_core: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fexcy.zero_player
        pluginClass: ZeroPlayerPlugin
      ios:
        pluginClass: ZeroPlayerPlugin
      macos:
        pluginClass: ZeroPlayerPlugin

  shaders:
    - shaders/zero_blur.frag
