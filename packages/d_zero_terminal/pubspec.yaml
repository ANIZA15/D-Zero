name: d_zero_terminal
description: "Ultra-lightweight zero-allocation FFI PTY terminal emulator with C++17 VT100/TrueColor parser and single-pass Impeller drawRawAtlas rendering."
version: 0.1.4
homepage: https://github.com/ANIZA15/D-Zero
repository: https://github.com/ANIZA15/D-Zero/tree/main/packages/d_zero_terminal
issue_tracker: https://github.com/ANIZA15/D-Zero/issues
topics:
  - terminal
  - pty
  - vt100
  - impeller
  - ffi

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  d_zero_core: ^0.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: ZeroTerminalPlugin
      windows:
        pluginClass: ZeroTerminalPluginCApi
