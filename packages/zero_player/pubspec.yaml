name: zero_player
description: "A next-generation, zero-jank Flutter video player optimized for Impeller, utilizing FFI shared-memory and custom RenderBoxes."
version: 0.0.2
homepage: https://github.com/ANIZA15/d-zero
repository: https://github.com/ANIZA15/d-zero/tree/main/packages/zero_player
issue_tracker: https://github.com/ANIZA15/d-zero/issues
topics:
  - video
  - player
  - impeller
  - ffi
  - streaming

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.2
  zero_core:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fexcy.zero_player
        pluginClass: ZeroPlayerPlugin
      ios:
        pluginClass: ZeroPlayerPlugin

  shaders:
    - shaders/zero_blur.frag
