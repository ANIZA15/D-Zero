name: benchmark_app
description: "Interactive visual benchmark comparing traditional Flutter implementations vs D-Zero zero-allocation suite."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: ">=3.24.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  d_zero_core:
  d_zero_counter:
  d_zero_particles:
  d_zero_player:
  d_zero_ui:
  d_zero_chart:
  d_zero_waveform:
  d_zero_fx:
  d_zero_canvas:
  d_zero_sensor:
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
