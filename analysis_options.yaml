include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/build/**"
    - "**/.dart_tool/**"
    - "packages/*/example/android/**"
    - "packages/*/example/ios/**"
    - "packages/*/example/macos/**"
    - "packages/*/example/linux/**"
    - "packages/*/example/windows/**"
    - "packages/*/example/web/**"
    - "packages/*/example/test/**"

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_locals: true
    avoid_print: true
