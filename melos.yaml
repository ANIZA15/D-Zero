name: d_zero
repository: https://github.com/ANIZA15/D-Zero

packages:
  - packages/*
  - packages/*/example
  - apps/*
  - benchmarks

command:
  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    exec: flutter analyze .
    description: Run flutter analyze across all packages.

  test:
    exec: flutter test
    packageFilters:
      dirExists: test
    description: Run flutter test in all packages with tests.

  complexity:
    run: dart run tool/check_complexity.dart
    description: Measure and enforce cyclomatic complexity across the workspace.

  benchmark:
    run: dart run benchmarks/run_benchmarks.dart
    description: Run all terminal microbenchmarks.

  clean:
    exec: flutter clean
    description: Clean build artifacts in all packages.

  distribute:
    run: dart run tool/distribute_widgets.dart --dry-run
    description: Sync metadata, run quality gates, and validate all Z-Widget packages via pub publish --dry-run in topological order.

  distribute:publish:
    run: dart run tool/distribute_widgets.dart --publish
    description: Batch publish all Z-Widget packages to pub.dev in topological dependency order.

  distribute:sync:
    run: dart run tool/distribute_widgets.dart --sync-only
    description: Sync LICENSE, .pubignore, internal dependency versions, and audit Z-Prefix widgets across all packages.

  distribute:bundle:
    run: dart run tool/distribute_widgets.dart --bundle --skip-checks
    description: Generate local release archives (.tar.gz), manifest.json, and unified barrel file in dist/.
